<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VERAMOR</title>
<style>
html,body{height:100%;margin:0;background:#0a0810;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:grid;place-items:center}.boot{width:min(430px,88vw);text-align:center}.mark{font-size:30px;font-weight:900;letter-spacing:.08em}.sub{margin-top:10px;color:#c9c1d4;font-size:14px;line-height:1.5}.bar{height:5px;background:#24202c;border-radius:99px;overflow:hidden;margin:24px auto 0}.fill{height:100%;width:25%;background:linear-gradient(90deg,#fff,#9a8cff);border-radius:inherit;animation:load 1.3s ease-in-out infinite alternate}@keyframes load{to{width:100%}}button{margin-top:18px;border:1px solid #423a51;background:#18131f;color:#fff;border-radius:12px;padding:11px 18px;font-weight:700;display:none}.err button{display:inline-block}.err .fill{display:none}
</style>
</head>
<body>
<div id="boot" class="boot"><div class="mark">VERAMOR</div><div id="status" class="sub">Starting secure beta…</div><div class="bar"><div class="fill"></div></div><button id="retry">Retry</button></div>
<script>
(()=>{
 const COMMIT='60bb727ac20051076ea14d70fba860268358aead';
 const EXPECTED='9291b56cb690726c854dd067042e03614c03c982fae1df7b05865f440f4ccd94';
 const BASE=`https://raw.githubusercontent.com/davidseignious/old-town-tatu/${COMMIT}/veramor-v95/`;
 const status=document.getElementById('status'),boot=document.getElementById('boot'),retry=document.getElementById('retry');
 const fail=(m)=>{boot.classList.add('err');status.textContent=m};
 const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
 async function start(){
  try{
   boot.classList.remove('err');status.textContent='Verifying secure beta…';
   const parts=await Promise.all(Array.from({length:21},async(_,i)=>{
    const n=String(i).padStart(3,'0');
    const r=await fetch(`${BASE}p${n}.txt`,{cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer'});
    if(!r.ok) throw new Error(`asset ${n}`);
    return (await r.text()).trim();
   }));
   const payload=parts.join('');
   const digest=hex(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(payload)));
   if(digest!==EXPECTED) throw new Error('integrity');
   status.textContent='Opening VERAMOR…';
   const raw=atob(payload),bytes=new Uint8Array(raw.length);
   for(let i=0;i<raw.length;i++) bytes[i]=raw.charCodeAt(i);
   const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
   const html=await new Response(stream).text();
   document.open();document.write(html);document.close();
  }catch(e){
   console.error('VERAMOR secure boot failed',e);
   fail('Secure startup could not verify the app. Check your connection and retry.');
  }
 }
 retry.onclick=start; start();
})();
</script>
</body>
</html>
